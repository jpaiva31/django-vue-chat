[tool.poetry]
name = "realmate-challenge"
version = "0.1.0"
description = "Desafio Realmate - webhook sync"
authors = ["Joao Paiva <jppaiva85@gmail.com>"]


[tool.poetry.dependencies]
python = "^3.11"
django = "^4.2"
djangorestframework = "^3.15"
psycopg2-binary = "^2.9"
gunicorn = "^20.1"
uvicorn = "^0.23"
python-dotenv = "^1.1"
whitenoise = "^6.11.0"
django-auditlog = "^3.3.0"
pytest = "^7.0"
pytest-django = "^4.8"
pytest-cov = "^5.0"
factory-boy = "^3.3"
Faker = "^30.0"
django-cors-headers = "^4.9.0"


[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = [
    "ruff (>=0.14.7,<0.15.0)"
]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py310"

select = [
    "E",  # Errors do pycodestyle
    "F",  # pyflakes
    "I",  # isort
    "B",  # bugbear
    "D",  # docstrings
]

ignore = [
    "D100",  # Missing docstring in module
    "D104",  # Missing docstring in package
    "D401",  # docstring imperativa
    "B904",
    "D205"
]

exclude = [
    "migrations",
    ".venv",
    "realmate_challenge/settings.py",
    "realmate_challenge/wsgi.py",
    "**/apps.py",
]

[tool.ruff.per-file-ignores]
"**/models.py" = ["D106"]
"**/serializers.py" = ["D106"]

[tool.ruff.format]
quote-style = "double"          # "" ao invés de ''
indent-style = "space"
line-ending = "auto"
